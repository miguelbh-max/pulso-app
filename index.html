<style>
:root{
  --bg:#0A0B0A;
  --surface:#141613;
  --surface-2:#1B1F1B;
  --line:#262B26;
  --lime:#00E68C;
  --pulse:#FF5252;
  --text:#F2F5F3;
  --muted:#8B948F;
  --muscle-off:#262B26;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:linear-gradient(180deg, rgba(10,11,10,0.22), rgba(10,11,10,0.35) 30%, rgba(10,11,10,0.68) 62%, rgba(10,11,10,0.92) 100%);
  background-color:#0A0B0A;
  background-size: cover;
  background-attachment: fixed;
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.display{font-family:'Inter',sans-serif; font-weight:800; letter-spacing:-0.02em;}
header{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg, rgba(8,9,8,0.55), rgba(8,9,8,0.15));
  backdrop-filter:blur(6px);
  padding:18px 20px 14px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .dot{
  width:12px; height:12px; border-radius:50%;
  background:var(--pulse);
  box-shadow:0 0 0 0 rgba(255,82,82,0.6);
  animation:beat 1.15s infinite;
}
@keyframes beat{
  0%{box-shadow:0 0 0 0 rgba(255,82,82,0.55);}
  70%{box-shadow:0 0 0 9px rgba(255,82,82,0);}
  100%{box-shadow:0 0 0 0 rgba(255,82,82,0);}
}
</style>
